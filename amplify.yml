version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npm run prisma:migrate:safe
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Copy console variables into the build so the server runtime can read them
        - echo "BEDROCK_API_KEY=$BEDROCK_API_KEY" >> .env.production
        - echo "BEDROCK_REGION=$BEDROCK_REGION" >> .env.production
        - echo "BEDROCK_MODEL_ID=$BEDROCK_MODEL_ID" >> .env.production
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.production
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
